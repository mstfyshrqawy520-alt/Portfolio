<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#08090D"/>
  <defs>
    <radialGradient id="glowAmber" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#08090D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glowAmber)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="#10121A" fill-opacity="0.8" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Logo Monogram -->
  <rect x="550" y="110" width="100" height="100" rx="28" fill="#181A26" stroke="#F59E0B" stroke-width="2"/>
  <text x="600" y="172" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#F59E0B" text-anchor="middle">AO</text>

  <!-- Title -->
  <text x="600" y="275" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#goldGradient)" text-anchor="middle">عبدالمجيد عويس | Abdelmagid Owais</text>

  <!-- Role Subtitle -->
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#E2E8F0" text-anchor="middle">Senior Video Editor &amp; Commercial Director</text>

  <!-- Tagline -->
  <text x="600" y="405" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#94A3B8" text-anchor="middle">Crafting High-Impact Cinematic Narratives • Powered by Google Drive CMS</text>

  <!-- Tags Pill Bar -->
  <rect x="360" y="475" width="480" height="48" rx="24" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5"/>
  <text x="600" y="505" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FBBF24" text-anchor="middle">Reels • TVCs • Real Estate • DaVinci Color • Sound Design</text>
</svg>
